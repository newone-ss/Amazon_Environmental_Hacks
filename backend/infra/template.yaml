AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bhujal — Decision-support tool for groundwater recharge planning.
  CloudFormation template for Lambda + API Gateway + DynamoDB + S3 + CloudFront.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.12
    Environment:
      Variables:
        DYNAMODB_TABLE_OBSERVATIONS: !Ref ObservationsTable
        DYNAMODB_TABLE_BEDROCK_CACHE: !Ref BedrockCacheTable
        S3_BUCKET_UPLOADS: !Ref UploadsBucket
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        LOG_LEVEL: INFO

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

Resources:

  # ── API Gateway HTTP API ────────────────────────
  BhujalApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
          - PUT
          - DELETE
        AllowHeaders:
          - "*"

  # ── Lambda Function ────────────────────────────
  BhujalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: app.handler
      CodeUri: ../../build/lambda/
      Description: Bhujal FastAPI backend via Mangum
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ObservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BedrockCacheTable
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BhujalApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BhujalApi
            Path: /
            Method: ANY

  # ── DynamoDB — Observations ────────────────────
  ObservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-observations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: observation_id
          AttributeType: S
        - AttributeName: site_id
          AttributeType: S
      KeySchema:
        - AttributeName: observation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: site-index
          KeySchema:
            - AttributeName: site_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── DynamoDB — Bedrock Response Cache ────────
  BedrockCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-bedrock-cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH

  # ── S3 — File Uploads (photos, reports, DPR packages) ──────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "bhujal-uploads-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
               DaysAfterInitiation: 7

  # ── S3 — Frontend Static Hosting ──────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "bhujal-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ── CloudFront — Frontend & API Gateway CDN ───
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${BhujalApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Accept
              Cookies:
                Forward: none
          - PathPattern: /docs*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
          - PathPattern: /openapi.json
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: Direct API Gateway endpoint URL
    Value: !Sub "https://${BhujalApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  FrontendUrl:
    Description: Production CloudFront web app URL
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  FrontendBucketName:
    Description: S3 bucket hosting frontend static assets
    Value: !Ref FrontendBucket

  UploadsBucketName:
    Description: S3 bucket for uploads
    Value: !Ref UploadsBucket

  ObservationsTableName:
    Description: DynamoDB table for observations
    Value: !Ref ObservationsTable

  BedrockCacheTableName:
    Description: DynamoDB table for Bedrock response cache
    Value: !Ref BedrockCacheTable